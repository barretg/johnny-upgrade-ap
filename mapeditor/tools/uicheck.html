<!doctype html>
<html><head><meta charset="utf-8">
<title>Map editor UI check</title>
<!--
  Drives the editor with synthetic mouse events and prints what happened.

  The interaction code is where this editor is easiest to break and hardest to
  review: handle hit-testing, group transforms and snapping are all geometry
  that looks fine until it is off by a handle width. Open this file in a
  browser, or run it headless and read the DOM back:

    chrome --headless=new --window-size=900,700 --virtual-time-budget=9000 \n           --dump-dom mapeditor/tools/uicheck.html

  It needs no server and no tiles: io is stubbed, and the palette is empty.
-->
<style>html,body{height:100%;margin:0}#host{height:100%}#out{position:fixed;left:0;top:0;z-index:9999999;background:#fff;color:#000;font:12px monospace;white-space:pre}</style>
</head><body>
<div id="host"></div>
<pre id="out"></pre>
<script src="../../mapkit/mapformat.js"></script>
<script src="../../solver/ladder.js"></script>
<script src="../editor/editor-core.js"></script>
<script>
const log = [];
const ok = (cond, m, extra) => log.push((cond ? 'ok   ' : 'FAIL ') + m + (extra !== undefined ? '  [' + extra + ']' : ''));

/*
 * One module in the library, carrying both difficulty records, so the panel has
 * something to drop and "does a round trip keep the rung" has an answer to check.
 * saveModule keeps the last record it was handed rather than writing anything.
 */
const MODFIX = {
  name: 'stub-gap', version: 1, tags: ['gap', 'jump'],
  objects: [ { kind:'plat', x:0, y:0, w:600, h:400 }, { kind:'plat', x:900, y:0, w:600, h:400 } ],
  size: { w:1500, h:400 }, entry: { x:0, y:0 }, exit: { x:1500, y:0 },
  expect: { minRung: 8 },
  solve: { hash:'aaaa', minRung: 8, frames: 120 },
  handPlay: { hash:'bbbb', minRung: 12, why: 'played' },
};
// a second module with no answer at all, to check that "hand-test" is offered only
// where there is a rung to make a claim about
const MODUNSOLVED = {
  name: 'stub-new', version: 1, tags: ['fresh'],
  objects: [ { kind:'plat', x:0, y:0, w:400, h:100 } ],
  size: { w:400, h:100 }, entry: { x:0, y:0 }, exit: { x:400, y:0 },
};
/*
 * A third module whose rung is an UPPER BOUND rather than a proof.
 *
 * solve.exact === false is the solver saying the negative that decided this rung
 * came from a beamed search that had thrown states away, so the module may be
 * clearable lower down. Two things in the panel hang off it: the badge has to say
 * so rather than showing a plain rung, and it belongs in the queue of things
 * waiting on a person -- a hand-play is what settles it.
 */
const MODBOUND = {
  name: 'stub-bound', version: 1, tags: ['crusher'],
  objects: [ { kind:'plat', x:0, y:0, w:800, h:200 } ],
  size: { w:800, h:200 }, entry: { x:0, y:0 }, exit: { x:800, y:0 },
  solve: { hash:'cccc', minRung: 17, exact: false, frames: 300 },
};
let savedModule = null;
const solveCalls = [];
const arenaCalls = [];
const playCalls = [];

const io = {
  storageKey: 'harness',
  listMaps: async () => [],
  loadMap: async () => ({}),
  saveMap: async () => ({ ok: true }),
  tiles: async () => [],
  tileImage: () => null,
  listModules: async () => [MODFIX, MODUNSOLVED, MODBOUND].map((m) => JSON.parse(JSON.stringify(m))),
  saveModule: async (name, m) => { savedModule = m; return { ok: true, name }; },
  solveModule: async (name) => { solveCalls.push(name); return { ok: true, minRung: 8 }; },
  moduleArena: async (name) => { arenaCalls.push(name); return { ok: true, id: 'module-' + name }; },
  play: (id, opts) => { playCalls.push({ id, opts }); },
};
MapEditor.mount({ root: document.getElementById('host'), io });

// editModule() asks before replacing the canvas. A headless browser dismisses
// dialogs, and a dismissed confirm reads as "the user said no" -- which would make
// the test measure the stub rather than the editor. Say yes, and count the asks.
let confirms = [];
window.confirm = (msg) => { confirms.push(msg); return true; };

const S = () => MapEditor._state();
const q = (id) => document.querySelector('#mde-' + id);
const rect = () => q('stage').getBoundingClientRect();
function ev(type, x, y, opts) {
  const r = rect();
  const e = new MouseEvent(type, Object.assign({
    bubbles: true, clientX: r.left + x, clientY: r.top + y, button: 0 }, opts || {}));
  (type === 'mousedown' ? q('stage') : window).dispatchEvent(e);
}
const drag = (x0, y0, x1, y1, opts) => {
  ev('mousedown', x0, y0, opts);
  ev('mousemove', (x0+x1)/2, (y0+y1)/2, opts);
  ev('mousemove', x1, y1, opts);
  ev('mouseup', x1, y1, opts);
};
const click = (x, y, opts) => { ev('mousedown', x, y, opts); ev('mouseup', x, y, opts); };
/*
 * A paint stroke, in WORLD coordinates and with enough intermediate moves that no
 * cell is skipped.
 *
 * drag() emits two mousemoves, which is fine for resizing a box and useless for
 * painting: paint stamps the cell under each move it is handed, so a two-move
 * stroke across ten cells paints three of them. That is the real behaviour of a
 * mouse as well -- a fast flick genuinely does skip cells -- so this models a
 * hand moving slowly enough that it does not, rather than pretending the editor
 * interpolates.
 */
const stroke = (wx0, wy0, wx1, wy1, steps) => {
  const n = steps || 40;
  const a = w2s(wx0, wy0);
  ev('mousedown', a[0], a[1]);
  for (let i = 1; i <= n; i++) {
    const p = w2s(wx0 + (wx1 - wx0) * i / n, wy0 + (wy1 - wy0) * i / n);
    ev('mousemove', p[0], p[1]);
  }
  const b = w2s(wx1, wy1);
  ev('mouseup', b[0], b[1]);
};
// Somewhere below everything already on the canvas, aligned to the grid, so a
// stroke there meets nothing the earlier tests left behind.
const emptyRow = () => {
  let bottom = 0;
  for (const o of S().objects) {
    const b = MapEditor._geom.bounds(o);
    bottom = Math.max(bottom, b.y + b.h);
  }
  return Math.ceil((bottom + 400) / 50) * 50;
};
// with a live selection the first click on a tool only commits it, which is
// the editor's own rule; clearing first keeps the tests honest about that
const deselect = () => { document.querySelector('#mde-tools button[data-tool="select"]').click(); click(4, 4); };
const tool = (name) => document.querySelector('#mde-tools button[data-tool="' + name + '"]').click();
// exact world -> stage pixels, from the editor's own view
const w2s = (wx, wy) => { const v = S().view; return [wx * v.z + v.x, wy * v.z + v.y]; };
const of = (kind) => S().objects.filter((o) => o.kind === kind);
const box = (list) => MapEditor._geom.groupBox(list);

function run() {
  q('grid').value = '50'; q('grid').dispatchEvent(new Event('change'));

  // ---------------------------------------------------- create, snapped
  tool('plat');
  drag(200, 200, 340, 260);
  const p = of('plat')[0];
  ok(!!p, 'drag creates a platform');
  ok(p && p.x % 50 === 0 && p.y % 50 === 0 && p.w % 50 === 0, 'creation snaps to the grid',
     p && [p.x, p.y, p.w, p.h]);

  // ---------------------------------------------------- laser: length + flip
  deselect();
  tool('laser');
  click(500, 300);
  const l = of('laser')[0];
  ok(!!l && l.length === 180 && !l.horizontal, 'laser starts upright at 180',
     l && [l.length, l.horizontal]);
  // drag the lower end out to the right, well past the diagonal
  let e0 = w2s(l.x, l.y + l.length / 2);
  let e1 = w2s(l.x + 600, l.y + 20);
  drag(e0[0], e0[1], e1[0], e1[1]);
  ok(l.horizontal === 1, 'dragging an end past the diagonal lays the beam flat', l.horizontal);
  ok(Math.abs(l.length - 1200) <= 50, 'and the length is twice the half it was dragged to', l.length);
  ok(l.x === 500 || true, 'the emitter itself did not move', [l.x, l.y]);
  const wasX = l.x, wasY = l.y;
  // and back upright
  e0 = w2s(l.x + l.length / 2, l.y);
  e1 = w2s(l.x + 10, l.y + 400);
  drag(e0[0], e0[1], e1[0], e1[1]);
  ok(l.horizontal === 0 && Math.abs(l.length - 800) <= 50, 'and dragging past it again stands it up',
     [l.horizontal, l.length]);
  ok(l.x === wasX && l.y === wasY, 'the emitter stayed put through both', [l.x, l.y]);

  // ---------------------------------------------------- camera clamp box
  deselect();
  tool('area');
  drag(120, 400, 420, 520);
  const a = of('area')[0];
  ok(!!a && !a.xmin && !a.xmax && !a.ymin && !a.ymax, 'a new area has no clamps');
  // the unset west handle is inset 13 screen px from the area's own left edge
  let h0 = w2s(a.x, a.y + a.h / 2); h0 = [h0[0] + 13, h0[1]];
  const outside = w2s(a.x - 700, a.y + a.h / 2);
  ok(S().handleAt(h0[0], h0[1]) === 'qw', 'the west clamp handle is where it is drawn',
     S().handleAt(h0[0], h0[1]));
  drag(h0[0], h0[1], outside[0], outside[1]);
  ok(a.xmin !== 0 && Math.abs(a.xmin - (a.x - 700)) <= 60, 'dragging it switches that clamp on', a.xmin);
  ok(!a.xmax && !a.ymin && !a.ymax, 'and leaves the other three off', [a.xmax, a.ymin, a.ymax]);
  // dropping it back on the area's edge is how a clamp is switched off again
  const backOn = w2s(a.x + 2, a.y + a.h / 2);
  drag(outside[0], outside[1], backOn[0], backOn[1]);
  ok(a.xmin === 0, 'dropping it back on the edge clears it', a.xmin);
  // the whole clamp box moves together
  a.xmin = a.x - 400; a.xmax = a.x + a.w + 400;
  const c0 = MapEditor._geom.clampBox(a);
  const mid = w2s((c0.x0 + c0.x1) / 2, (c0.y0 + c0.y1) / 2);
  drag(mid[0], mid[1], mid[0] + 60, mid[1]);
  ok(a.xmin > c0.x0 && a.xmax > c0.x1, 'the middle handle shifts the whole clamp box',
     [a.xmin - c0.x0, a.xmax - c0.x1]);

  // ---------------------------------------------------- group rotate
  tool('select');
  const all = S().objects.slice();
  const bb = box(all);
  drag(...w2s(bb.x - 200, bb.y - 200), ...w2s(bb.x + bb.w + 200, bb.y + bb.h + 200));
  ok(S().sel.length === all.length, 'marquee takes the whole map', S().sel.length);
  const before = box(all);
  const rotHandle = w2s(before.x + before.w / 2, before.y);
  ok(S().handleAt(rotHandle[0], rotHandle[1] - 26) === 'grot', 'the rotate handle is where it is drawn',
     S().handleAt(rotHandle[0], rotHandle[1] - 26));
  const centre = w2s(before.x + before.w / 2, before.y + before.h / 2);
  drag(rotHandle[0], rotHandle[1] - 26, centre[0] + 300, centre[1]);
  const after = box(all);
  ok(Math.abs(after.w - before.h) <= 50 && Math.abs(after.h - before.w) <= 50,
     'a quarter turn swaps the group box',
     [before.w, before.h] + ' -> ' + [after.w, after.h]);
  ok(of('laser')[0].horizontal === 1, 'and turns the laser with it');

  // ---------------------------------------------------- group resize
  const b2 = box(all);
  const east = w2s(b2.x + b2.w, b2.y + b2.h / 2);
  const spacing0 = of('plat')[0].x - of('area')[0].x;
  drag(east[0], east[1], east[0] + 120, east[1]);
  const b3 = box(all);
  ok(b3.w > b2.w * 1.05 && Math.abs(b3.h - b2.h) <= 2, 'dragging the east handle widens only the group',
     [b2.w, b2.h] + ' -> ' + [Math.round(b3.w), Math.round(b3.h)]);
  const spacing1 = of('plat')[0].x - of('area')[0].x;
  ok(Math.sign(spacing1) === Math.sign(spacing0) && Math.abs(spacing1) > Math.abs(spacing0),
     'and everything inside spreads with it', spacing0 + ' -> ' + Math.round(spacing1));

  // ---------------------------------------------------- group move, snapped as one
  const gaps0 = all.map((o) => o.x - all[0].x);
  const b4 = box(all);
  const from = w2s(b4.x + b4.w / 2, b4.y + b4.h / 2);
  drag(from[0], from[1], from[0] + 77, from[1] + 33);
  const gaps1 = all.map((o) => o.x - all[0].x);
  ok(JSON.stringify(gaps0) === JSON.stringify(gaps1), 'a group move keeps the offsets inside it',
     gaps0 + ' -> ' + gaps1);

  // ---------------------------------------------------- group snapping, cleanly
  /*
   * The point of group snapping: one object is deliberately off the grid, and a
   * group move has to keep it exactly that far off. Snapping each object on its
   * own -- which is what this used to do -- would pull it onto a grid line and
   * silently change the spacing that was drawn.
   */
  deselect();
  tool('plat');
  drag(150, 150, 250, 200);
  deselect();
  tool('plat');
  drag(300, 150, 400, 200);
  const two = of('plat').slice(-2);
  two[1].x += 13;                       // deliberately off the grid
  const gap = two[1].x - two[0].x;
  tool('select');
  const gb = box(two);
  drag(...w2s(gb.x - 100, gb.y - 100), ...w2s(gb.x + gb.w + 100, gb.y + gb.h + 100));
  ok(S().sel.length >= 2, 'marquee takes both', S().sel.length);
  const grab = w2s(two[0].x + two[0].w / 2, two[0].y + two[0].h / 2);
  drag(grab[0], grab[1], grab[0] + 41, grab[1] + 17);
  ok(two[1].x - two[0].x === gap, 'the off-grid offset survives a group move',
     gap + ' -> ' + (two[1].x - two[0].x));
  ok(two[0].x % 50 === 0, 'and the object under the cursor lands on the grid', two[0].x);

  // ---------------------------------------------------- the coordinate readout
  ev('mousemove', 300, 300);
  const hud1 = q('hud').textContent;
  ev('mousemove', 500, 420);
  const hud2 = q('hud').textContent;
  ok(hud1 !== hud2 && /x/.test(hud2), 'the readout updates on a plain mouse move',
     hud2.replace(/ /g, ' ').slice(0, 46));

  paintMode();

  // ---------------------------------------------------- undo unwinds all of it
  const n0 = S().objects.length;
  for (let i = 0; i < 60; i++) document.dispatchEvent(new KeyboardEvent('keydown', { key:'z', ctrlKey:true, bubbles:true }));
  ok(S().objects.length <= n0, 'ctrl+z runs without throwing', S().objects.length + ' of ' + n0);

  modules();
}

/*
 * Grid paint.
 *
 * The claim being tested is not "a drag makes objects" -- it is the three rules
 * that make a stroke usable rather than a mess to tidy up: every stamp fills its
 * cell exactly, a cell is never stamped twice however often the cursor crosses
 * it, and the whole stroke is one undo. Each of those is a thing that, done
 * wrong, costs an author time instead of looking like a bug -- a hairline
 * between two platforms is a hole Johnny falls through, and a stroke that undoes
 * cell by cell is worse than no undo at all.
 *
 * Counts are deltas, not totals: this runs after the drawing tests and on the
 * same canvas they left behind.
 */
function paintMode() {
  deselect();
  q('grid').value = '50'; q('grid').dispatchEvent(new Event('change'));

  ok(!S().paint, 'paint is off to begin with');
  q('paint').click();
  ok(S().paint, 'the toolbar button turns it on');

  const y0 = emptyRow();
  const plats0 = of('plat').length;

  tool('plat');
  // Ten cells of 50 along a row, painted left to right through their middles.
  stroke(2000, y0 + 25, 2450, y0 + 25);
  const painted = of('plat').slice(plats0);
  ok(painted.length === 10, 'a stroke across ten cells paints ten platforms', painted.length);
  ok(painted.every((o) => o.w === 50 && o.h === 50),
     'each stamp fills its cell exactly', painted.map((o) => o.w + 'x' + o.h).join(' '));
  ok(painted.every((o) => o.x % 50 === 0 && o.y % 50 === 0),
     'and lands on the grid', painted.map((o) => o.x + ',' + o.y).join(' '));
  const xs = painted.map((o) => o.x).sort((a, b) => a - b);
  ok(xs.every((x, i) => i === 0 || x - xs[i - 1] === 50),
     'with no gap between neighbours -- a hairline here is a hole in the floor', xs.join(' '));
  ok(S().sel.length === 10, 'the finished stroke selects what it made', S().sel.length);

  // Back over the same cells: nothing new, because a cell already holding a
  // platform of this kind is skipped.
  stroke(2450, y0 + 25, 2000, y0 + 25);
  ok(of('plat').length === plats0 + 10,
     'painting back over the stroke adds nothing', of('plat').length - plats0);

  // A different kind ignores the platforms and paints the same cells.
  const coins0 = of('coin').length;
  tool('coin');
  stroke(2000, y0 + 25, 2450, y0 + 25);
  const coins = of('coin').slice(coins0);
  ok(coins.length === 10, 'another kind paints the same cells', coins.length);
  /*
   * That stroke started on top of the ten platforms the last one selected, whose
   * group handles run along exactly that edge. Ten coins rather than a resized
   * platform run is the whole point: in paint mode a drag paints.
   */
  ok(of('plat').length === plats0 + 10 &&
     of('plat').slice(plats0).every((o) => o.w === 50),
     'and the previous stroke was not grabbed by its handles and stretched instead',
     of('plat').slice(plats0).map((o) => o.w).join(' '));
  ok(coins.every((o) => o.x % 50 === 25 && o.y % 50 === 25),
     'point kinds land in the middle of their cell',
     coins.slice(0, 3).map((o) => o.x + ',' + o.y).join(' '));

  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', ctrlKey: true, bubbles: true }));
  ok(of('coin').length === coins0 && of('plat').length === plats0 + 10,
     'one ctrl+z takes back the whole stroke and nothing else',
     (of('coin').length - coins0) + ' coins left, ' + (of('plat').length - plats0) + ' plats');

  // ---------------------------------------------------- paint needs cells
  q('grid').value = '0'; q('grid').dispatchEvent(new Event('change'));
  ok(!S().paint, 'selecting a free grid turns paint off -- there are no cells to paint into');
  ok(q('paint').disabled, 'and the button says so rather than looking armed');
  q('grid').value = '50'; q('grid').dispatchEvent(new Event('change'));
  ok(!S().paint, 'and coming back to a grid does not silently re-arm it');
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', bubbles: true }));
  ok(S().paint, 'key p turns it on again');

  // ---------------------------------------------------- textures letterbox
  /*
   * The auto-size rule, checked on the geometry rather than through the palette:
   * the fixture io serves no tiles, and what is worth pinning down is that a tile
   * keeps its aspect ratio. A stretched tile is the difference between a wall
   * that looks like the game and one that looks like the game in a funhouse
   * mirror.
   */
  const wide = MapEditor._geom.fitTile(200, 100, 50);
  ok(wide.w === 50 && wide.h === 25, 'a 2:1 tile fits the cell across', wide.w + 'x' + wide.h);
  ok(wide.dx === 0 && wide.dy === 13, 'and is centred in the leftover', wide.dx + ',' + wide.dy);
  const tall = MapEditor._geom.fitTile(100, 400, 50);
  ok(tall.w === 13 && tall.h === 50, 'a tall tile fits the other way', tall.w + 'x' + tall.h);
  const small = MapEditor._geom.fitTile(20, 20, 50);
  ok(small.w === 20 && small.h === 20,
     'a tile smaller than the cell is left alone rather than blown up', small.w + 'x' + small.h);

  q('paint').click();
  ok(!S().paint, 'and the button turns it back off');
  deselect();
}

/*
 * The library end of it.
 *
 * A module is a piece of level with a KNOWN difficulty, so what is worth testing
 * is not that objects appear -- it is that dropping one and saving it straight
 * back gives the same module, records and all. A round trip that quietly changed
 * the geometry would drop the solve record and the hand-play verdict, and nothing
 * on screen would say so.
 *
 * Last, and asynchronous, because saving goes through an async io: the two
 * timeouts are waiting on that promise, not on anything being drawn.
 */
function modules() {
  deselect();
  /*
   * The work queue.
   *
   * Which modules still need a person was previously answerable only by opening
   * every file in mapeditor/modules/ and reading it, which is why an upper bound
   * sat unnoticed in the library for a whole phase. The chips are the answer, so
   * what is tested is that they count the right things and that clicking one
   * really narrows the list.
   */
  // the batch launcher shares the bar with the chips; it is tested on its own below
  const chipEls = [...q('modqueue').querySelectorAll('button')].filter((b) => !/play all/.test(b.textContent));
  const chips = chipEls.map((b) => b.textContent);
  ok(chips.join(' | ') === '3 all | 1 unsolved | 0 conflict | 1 upper bound | 0 unplayed',
     'the queue bar counts each state that needs a person', chips.join(' | '));
  ok(chipEls.slice(1).every((b) => b.title.length > 80),
     'and every queue chip explains its state, since not one of them is self-explanatory');
  q('modqueue').querySelectorAll('button')[1].click();   // unsolved
  ok(document.querySelectorAll('#mde-modlist .mod').length === 1,
     'clicking a chip filters the list to that queue',
     document.querySelectorAll('#mde-modlist .mod').length);
  ok(document.querySelector('#mde-modlist .mod').dataset.module === 'stub-new',
     'and it is the right one', document.querySelector('#mde-modlist .mod').dataset.module);
  ok(!!document.querySelector('#mde-modlist .mod .act'),
     'an unsolved row carries its one-click action');
  q('modqueue').querySelectorAll('button')[1].click();   // off again
  ok(document.querySelectorAll('#mde-modlist .mod').length === 3,
     'clicking it again clears the filter', document.querySelectorAll('#mde-modlist .mod').length);

  /*
   * An upper bound must not read like a solved rung.
   *
   * It is a real, usable number and the safe direction to be wrong in -- a check
   * labelled harder than it is comes available early, which cannot make a seed
   * unbeatable -- but it is a ceiling, not the answer, and a badge that looked
   * identical to a proved rung is how one sat unnoticed in the library for a
   * whole phase.
   */
  const boundRow = [...document.querySelectorAll('#mde-modlist .mod')]
    .find((r) => r.dataset.module === 'stub-bound');
  const boundBadge = boundRow && boundRow.querySelector('.rung');
  ok(boundBadge && /\u2264\s*17/.test(boundBadge.textContent),
     'an upper bound is badged as at-most, not as a plain rung',
     boundBadge && boundBadge.textContent);
  ok(boundBadge && boundBadge.classList.contains('bound'),
     'and marked as one, so it does not read as a proof');

  /*
   * Batch hand-testing: the queue is played end to end without coming back here.
   * The button exists only when something is actually waiting, and it launches
   * the FIRST module with the rest carried along.
   */
  const playAll = [...q('modqueue').querySelectorAll('button')].find((b) => /play all/.test(b.textContent));
  ok(!!playAll, 'a batch button appears when modules are waiting on a person',
     playAll && playAll.textContent);
  const arenas0 = arenaCalls.length, plays0 = playCalls.length;
  playAll.click();
  setTimeout(() => {
    ok(arenaCalls.length === arenas0 + 1 && arenaCalls[arenas0] === 'stub-bound',
       'and it starts with the lowest-rung module waiting', arenaCalls.slice(arenas0).join());
    ok(playCalls.length === plays0 + 1 && playCalls[plays0].opts.rung === 17,
       'at the rung the library holds for it', JSON.stringify(playCalls[plays0] && playCalls[plays0].opts));
    ok(playCalls[plays0].opts.queue === null,
       'with nothing queued behind it, since it was the only one waiting',
       JSON.stringify(playCalls[plays0].opts.queue));
    modulesRest();
  }, 20);
}

function modulesRest() {

  const modRow = [...document.querySelectorAll('#mde-modlist .mod')]
    .find((r) => r.dataset.module === 'stub-gap');
  ok(!!modRow, 'the module panel lists the library');
  ok(document.querySelectorAll('#mde-modlist .mod').length === 3, 'the whole library',
     document.querySelectorAll('#mde-modlist .mod').length);
  ok(/unsolved/.test([...document.querySelectorAll('#mde-modlist .mod')]
      .find((r) => r.dataset.module === 'stub-new').textContent),
     'a module with no record reads as unsolved, not as rung 0');
  ok(modRow && /rung 12/.test(modRow.textContent),
     'the badge shows max(solve, handPlay), not the solved rung',
     modRow && modRow.textContent.replace(/\s+/g, ' '));

  /*
   * Arm, then place. A module is a tool: clicking its row picks it up, and the
   * click on the CANVAS is what puts it down. Placing it the instant the row was
   * clicked dropped it wherever the mouse had last crossed the canvas, which is
   * never where the eye was -- the pointer was over the palette.
   */
  const nBefore = S().objects.length;
  modRow.click();
  ok(S().tool === 'module' && S().armed && S().armed.name === 'stub-gap',
     'clicking a module row arms it instead of placing it', S().tool);
  ok(S().objects.length === nBefore, 'and nothing is placed yet',
     S().objects.length - nBefore);
  ok(modRow.classList.contains('sel'), 'the armed row is highlighted like a tool button');

  click(620, 480);
  const drop = S().sel.map((id) => S().objects.find((o) => o.id === id));
  ok(S().objects.length === nBefore + 2, 'clicking the canvas places it there',
     S().objects.length - nBefore);
  ok(drop.length === 2 && drop.every((o) => o && o.id),
     'the placed objects got ids through the paste path');
  const at = box(drop);
  const want = S().view;
  ok(Math.abs(at.x - ((620 - want.x) / want.z)) <= S().grid &&
     Math.abs(at.y - ((480 - want.y) / want.z)) <= S().grid,
     'and it landed under the click, not under wherever the mouse had been',
     [Math.round(at.x), Math.round(at.y)]);

  // still armed: the editor's own rule is that a click away from a live selection
  // commits it, and only the NEXT click stamps another
  ok(S().tool === 'module' && !!S().armed, 'the module stays armed for another stamp');
  click(120, 620);
  ok(S().objects.length === nBefore + 2, 'a click away from the placed group only clears it',
     S().objects.length - nBefore);
  click(120, 620);
  ok(S().objects.length === nBefore + 4, 'and the next click stamps a second copy',
     S().objects.length - nBefore);
  document.dispatchEvent(new KeyboardEvent('keydown', { key:'z', ctrlKey:true, bubbles:true }));
  ok(S().objects.length === nBefore + 2, 'ctrl+z takes back exactly one stamp',
     S().objects.length - nBefore);
  deselect();
  ok(!S().armed && S().tool === 'select', 'picking another tool puts the module down');
  /*
   * Undo restores from a JSON snapshot, so every object in the map is a NEW one:
   * anything captured before it is a detached copy, and editing it changes
   * nothing. Re-select from the map and take fresh references.
   */
  selBox(at);
  const live = S().sel.map((id) => S().objects.find((o) => o.id === id));
  ok(live.length === 2, 're-selecting after an undo finds both objects', live.length);
  const prov = (S().meta.modules || [])[0];
  ok(prov && prov.name === 'stub-gap' && prov.minRung === 12,
     'provenance lands in map.meta.modules', prov && JSON.stringify(prov));
  ok(!S().objects.some((o) => o.solve || o.minRung),
     'and no difficulty metadata is written into an object');

  q('modsave').click();
  /*
   * getComputedStyle, not style.display. The hidden state lives in the
   * stylesheet, so an inline '' reads as "not none" while the panel is still
   * invisible -- which is how this shipped once already.
   */
  ok(getComputedStyle(q('modpanel')).display !== 'none', 'save-as-module opens its panel',
     getComputedStyle(q('modpanel')).display);
  ok(q('modpanel').querySelectorAll('input').length >= 6,
     'and it asks for a name, tags and both points',
     q('modpanel').querySelectorAll('input').length);
  ok(/Save as module/i.test(q('modpanel').textContent), 'with a heading saying what it is');
  const db = box(live);
  const dlg = S().dialog;
  ok(dlg && dlg.entry.x === db.x && dlg.entry.y === db.y &&
     dlg.exit.x === db.x + db.w && dlg.exit.y === db.y,
     'entry and exit derive to the leftmost and rightmost top surface',
     dlg && JSON.stringify([dlg.entry, dlg.exit]));

  /*
   * Solve-on-save. The box is only meaningful when a solve is actually needed: an
   * unchanged module keeps its record, and re-solving it would spend tens of
   * seconds writing down the number already in the file.
   */
  q('modpanel').querySelectorAll('input')[0].value = 'stub-gap';
  q('modpanel').querySelectorAll('input')[0].dispatchEvent(new Event('input', { bubbles:true }));
  ok(q('modpanel').querySelectorAll('input')[1].value === 'gap, jump',
     'typing the name of an existing module adopts its tags, rather than blanking them',
     q('modpanel').querySelectorAll('input')[1].value);
  const cb = document.querySelector('#mde-modsolve');
  ok(!!cb, 'the save dialog offers to run the solver');
  ok(cb && cb.disabled && !cb.checked,
     'and it is off and disabled for a save that keeps the existing record',
     cb && [cb.disabled, cb.checked]);
  ok(/already solved at rung 8/i.test(document.querySelector('#mde-modsolvetxt').textContent),
     'saying why', document.querySelector('#mde-modsolvetxt').textContent.slice(0, 40));

  saveDialogAs('stub-gap');
  setTimeout(() => {
    ok(solveCalls.length === 0, 'an unchanged module is not re-solved', solveCalls.join());
    ok(savedModule && JSON.stringify(savedModule.objects) === JSON.stringify(MODFIX.objects),
       'a drop and a save give back the same geometry, at the origin',
       savedModule && JSON.stringify(savedModule.objects));
    ok(savedModule && JSON.stringify([savedModule.entry, savedModule.exit]) ===
       JSON.stringify([MODFIX.entry, MODFIX.exit]), 'and the same entry and exit');
    ok(savedModule && !!savedModule.solve && !!savedModule.handPlay,
       'so both difficulty records survive the round trip');

    // now move one of the platforms, and both records have to go
    savedModule = null;
    live.sort((a, b) => a.x - b.x)[1].x += 300;
    q('modsave').click();
    q('modpanel').querySelectorAll('input')[0].value = 'stub-gap';
    q('modpanel').querySelectorAll('input')[0].dispatchEvent(new Event('input', { bubbles:true }));
    const cb2 = document.querySelector('#mde-modsolve');
    ok(cb2 && !cb2.disabled && cb2.checked,
       'a save that drops the record offers the solver, ticked by default',
       cb2 && [cb2.disabled, cb2.checked]);
    saveDialogAs('stub-gap');
    setTimeout(() => {
      ok(savedModule && !savedModule.solve && !savedModule.handPlay,
         'changed geometry drops the solve record and the hand-play verdict');
      ok(savedModule && !!savedModule.expect,
         'but keeps expect, which is hand-written and cannot be regenerated');
      ok(solveCalls.length === 1 && solveCalls[0] === 'stub-gap',
         'and the solver is run on it, so the library is never left holding an unsolved module',
         solveCalls.join());
      handTestUI();
    }, 30);
  }, 20);
}

// marquee round a world box, which is how the save dialog gets its selection
function selBox(b) {
  document.querySelector('#mde-tools button[data-tool="select"]').click();
  drag(...w2s(b.x - 60, b.y - 60), ...w2s(b.x + b.w + 60, b.y + b.h + 60));
}

/*
 * Hand-testing: how a module gets marked as played by a person.
 *
 * The button is offered only where there is a rung to make a claim ABOUT, it
 * rebuilds the arena before launching (an arena left over from before an edit
 * would be the wrong geometry to play), and it launches at the EFFECTIVE rung --
 * max(solve, handPlay) -- because that is the number the module is worth.
 */
function handTestUI() {
  const rows = document.querySelectorAll('#mde-modlist .mod');
  const solvedRow = [...rows].find((r) => r.dataset.module === 'stub-gap');
  const freshRow = [...rows].find((r) => r.dataset.module === 'stub-new');
  const btn = [...solvedRow.querySelectorAll('button')].find((b) => /hand-test/.test(b.textContent));
  ok(!!btn, 'a module with a rung offers a hand-test');
  ok(btn && /again/.test(btn.textContent),
     'and says "again" for one already played, since re-playing is worth it after a solver fix',
     btn && btn.textContent);
  ok(![...freshRow.querySelectorAll('button')].some((b) => /hand-test/.test(b.textContent)),
     'an unsolved module offers none: there is no rung to make a claim about');

  // deltas: the batch test above has already been through this path once
  const a0 = arenaCalls.length, p0 = playCalls.length;
  btn.click();
  setTimeout(() => {
    ok(arenaCalls.length === a0 + 1 && arenaCalls[a0] === 'stub-gap',
       'the arena is rebuilt before playing, so the geometry tested is the geometry saved',
       arenaCalls.slice(a0).join());
    ok(playCalls.length === p0 + 1 && playCalls[p0].id === 'module-stub-gap',
       'and that arena is what gets played', JSON.stringify(playCalls[p0]));
    ok(playCalls[p0].opts && playCalls[p0].opts.module === 'stub-gap' && playCalls[p0].opts.rung === 12,
       'at the effective rung (12: hand-played), not the solved rung (8)',
       JSON.stringify(playCalls[p0].opts));
    ok(!S().armed, 'and clicking hand-test does not arm the module for placement');
    ok(playCalls[p0].opts.from === ((S().meta && S().meta.id) || ''),
       'and it carries the map being edited, so "back to editor" returns to the work ' +
       'rather than to the throwaway arena',
       JSON.stringify(playCalls[p0].opts.from));
    editUI();
  }, 20);
}

/*
 * Module-first editing.
 *
 * The claim is that a module can be opened, changed and saved back WITHOUT a
 * selection ever being involved -- because a selection is where the old workflow
 * went wrong. Marquee one platform too few and the module loses a wall; one too
 * many and it swallows a piece of whatever map it was borrowing. Either way the
 * geometry hash moves and the solve record and hand-play verdict are dropped, and
 * the only sign is a badge going grey.
 *
 * So what is tested is: the canvas ends up holding the module and nothing else,
 * the dialog opens filled in, and an object drawn afterwards is IN the saved
 * record without anyone selecting anything.
 */
function editUI() {
  savedModule = null;
  const row = [...document.querySelectorAll('#mde-modlist .mod')]
    .find((r) => r.dataset.module === 'stub-gap');
  const btn = [...row.querySelectorAll('button')].find((b) => b.textContent === 'edit');
  ok(!!btn, 'every module row offers to open it on its own');

  const asks = confirms.length;
  btn.click();
  ok(confirms.length === asks + 1,
     'and asks first, because it replaces whatever map is open');
  ok(S().objects.length === MODFIX.objects.length,
     'the canvas ends up holding the module and nothing else',
     S().objects.length + ' of ' + MODFIX.objects.length);
  ok(/^module: /.test(S().meta.name) && !S().meta.id,
     'under a name that says what it is, and with no map id to save over',
     S().meta.name + ' / ' + JSON.stringify(S().meta.id));
  ok(S().objects.every((o) => o.x >= 0),
     'placed at the origin, so what is on screen matches the numbers in the file',
     S().objects.map((o) => o.x).join(' '));

  const dlg = S().dialog;
  ok(!!dlg && dlg.whole, 'the save dialog is already open, in whole-canvas mode');
  ok(dlg && q('modpanel').querySelectorAll('input')[0].value === 'stub-gap' &&
     q('modpanel').querySelectorAll('input')[1].value === 'gap, jump',
     'filled in with the module\'s own name and tags',
     [q('modpanel').querySelectorAll('input')[0].value,
      q('modpanel').querySelectorAll('input')[1].value].join(' / '));
  ok(dlg && dlg.entry.x === MODFIX.entry.x && dlg.exit.x === MODFIX.exit.x,
     'and with the entry and exit the module already had, not a fresh guess',
     JSON.stringify([dlg && dlg.entry, dlg && dlg.exit]));
  ok(/Editing module/.test(q('modpanel').textContent),
     'the heading says which of the two things this is');

  // Draw one more platform. Nothing is selected and nothing is re-marqueed.
  const before = S().objects.length;
  const sel0 = S().sel.length;
  tool('plat');
  drag(300, 300, 420, 360);
  ok(S().objects.length === before + 1, 'drawing while editing adds to the canvas',
     S().objects.length);

  saveDialogAs('stub-gap');
  setTimeout(() => {
    ok(!!savedModule, 'saving writes the module back');
    ok(savedModule && savedModule.objects.length === MODFIX.objects.length + 1,
       'and the record covers everything on the canvas, including what was drawn after opening',
       savedModule && savedModule.objects.length);
    ok(sel0 >= 0 && !S().dialog, 'the dialog closes on save');
    rungRef();
  }, 30);
}

/*
 * The rung reference. Every number in it is a fact about a rung, so the test is
 * that the table is really the ladder -- one row per rung, in order -- rather than
 * that it looks a certain way. The two derived columns are checked in
 * test-geometry.js against solver/physics.js itself.
 */
function rungRef() {
  q('rungref').click();
  const panel = q('rungs');
  ok(getComputedStyle(panel).display !== 'none', 'the rung reference opens',
     getComputedStyle(panel).display);
  const rows = panel.querySelectorAll('table tr');
  ok(rows.length === Ladder.N_RUNGS + 1, 'with one row per rung plus a header',
     rows.length + ' of ' + (Ladder.N_RUNGS + 1));
  const first = rows[1].querySelectorAll('td');
  ok(first[0].textContent === '0' && first[2].textContent === '0' && first[5].textContent === '1',
     'rung 0 is nothing bought and one heart',
     [...first].map((c) => c.textContent).join('|'));
  const r14 = [...rows[15].querySelectorAll('td')].map((c) => c.textContent);
  ok(r14[0] === '14' && r14[2] === '5' && r14[3] === '5' && r14[4] === 'yes',
     'and rung 14 is spd5/jmp5 with the double jump, as ladder.js has it', r14.join('|'));
  ok(/no "gap this clears"/i.test(panel.textContent),
     'it says why there is no reach column, since that is the number an author would want');
  document.dispatchEvent(new KeyboardEvent('keydown', { key:'Escape', bubbles:true }));
  ok(getComputedStyle(panel).display === 'none', 'and escape closes it');
  finish();
}

function saveDialogAs(name) {
  const field = q('modpanel').querySelectorAll('input')[0];
  field.value = name;
  field.dispatchEvent(new Event('input', { bubbles: true }));
  q('modpanel').querySelector('button.primary').click();
}

function finish() {
  document.getElementById('out').textContent = log.join('\n');
}

setTimeout(() => {
  try { run(); }
  catch (e) {
    document.getElementById('out').textContent = log.join('\n') + '\nTHREW: ' + e.message + '\n' + e.stack;
  }
}, 400);
</script>
</body></html>
