<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  The SDK asks for its scripts and assets with RELATIVE paths ("js/phaser.js",
  "assets/pics/..."). This page is served at /play (no trailing slash), so those
  would resolve against / and 404. Pinning the base to /play/ makes them resolve
  where the server actually mounts the SDK, whatever the URL's trailing slash or
  query string looks like. Every other URL on this page is absolute, so nothing
  else is affected.
-->
<base href="/play/">
<title>Quick Run</title>
<style>
  :root { --panel:#1c1f28; --line:#2c3040; --text:#dde1ea; --dim:#8b93a7; --accent:#6ea8fe; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:#0d0f14; color:var(--text);
              font:13px/1.45 ui-sans-serif,system-ui,sans-serif; overflow:hidden; }
  body { display:grid; grid-template-columns:1fr 232px; }
  #game { display:grid; place-items:center; min-width:0; }
  #game canvas { max-width:100%; max-height:100vh; }
  aside { background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:10px 12px; }
  h2 { font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim);
       margin:12px 0 7px; font-weight:600; }
  h2:first-child { margin-top:0; }
  /* the sliders come from editor-play.js, which brings its own class names */
  .mep-up { display:grid; grid-template-columns:1fr 46px; gap:6px; align-items:center;
        margin-bottom:6px; font-size:11px; }
  .mep-up input[type=range] { width:100%; }
  .mep-v { text-align:right; color:var(--dim); font-variant-numeric:tabular-nums; font-size:11px; }
  .mep-lab { display:block; color:var(--dim); font-size:11px; }
  button { width:100%; background:#262b38; border:1px solid var(--line); color:var(--text);
           border-radius:6px; padding:6px 9px; font:inherit; font-size:11px; cursor:pointer;
           margin-bottom:6px; }
  button:hover { background:#303748; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#0d1017; font-weight:600; }
  .note { color:var(--dim); font-size:10px; line-height:1.4; margin:8px 0 0; }
  #status { font-size:11px; color:var(--dim); min-height:16px; }
  .chk { display:flex; gap:6px; align-items:center; font-size:11px;
         color:var(--dim); margin:2px 0 8px; cursor:pointer; }
  .chk input { margin:0; }
  /* the hand-test bar: this is the half of a module's difficulty a person answers */
  #hand { display:none; background:#1b2a22; border:1px solid #2c4436; border-radius:7px;
          padding:9px 10px; margin:0 0 10px; }
  #hand.void { background:#2a2519; border-color:#3d3520; }
  #hand h3 { margin:0 0 5px; font-size:11px; color:var(--text); }
  #hand .combo { font:10px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
                 color:var(--dim); word-break:break-all; }
  #hand textarea { width:100%; background:#12141a; border:1px solid var(--line); color:var(--text);
                   border-radius:5px; padding:5px 6px; font:inherit; font-size:10px; margin:7px 0 6px;
                   resize:vertical; min-height:52px; }
  #hand .msg { font-size:10px; line-height:1.4; color:var(--dim); margin:4px 0 0; }
  #hand .msg.bad { color:#e07a7a; }
  #hand .msg.good { color:#64d19a; }
</style>
</head>
<body>

<div id="game"></div>

<aside>
  <div id="hand"></div>
  <h2>Map</h2>
  <div id="status">loading…</div>
  <button id="restart" class="primary">restart level</button>
  <button id="back">back to editor</button>
  <label class="chk"><input type="checkbox" id="quickRestart" checked>
    <span>quick restart (skip shop)</span></label>

  <h2>Upgrades</h2>
  <div id="ups"></div>
  <button id="maxAll">max everything</button>
  <button id="zeroAll">reset to zero</button>

  <p class="note">Upgrades apply on the next level start — hit restart after changing them.</p>
</aside>

<script src="/solver/ladder.js"></script>
<script src="/editor-play.js"></script>
<script src="/mapkit/mapformat.js"></script>
<script src="/mapkit/crushers.js"></script>
<script src="/mapkit/doors.js"></script>
<script src="/mapkit/renderer.js"></script>
<script src="/mapkit/patcher.js"></script>
<script>
'use strict';
/*
 * Quick run: boot the real game against a map from the editor.
 *
 * This is the first point where a custom map meets the actual engine, so it is
 * deliberately the real SDK rather than a reimplementation -- if the map data is
 * wrong, it should be wrong here in the same way it would be in the shipped game.
 *
 * Three things have to be worked around to run the SDK off localhost:
 *
 *  1. loader.js destroys the game unless the page's hostname ends in one of
 *     coolmathgames.com / coolmath-games.com / cmatgame.local. `arr` is a plain
 *     global, so our host gets appended to it before the check runs.
 *  2. The splash and title screens are skipped, since the point is to be in the
 *     level immediately.
 *  3. iniLevel() paints the vanilla mural as six fixed background images. Those
 *     are hidden and the map's own art layer drawn instead, over flat black
 *     platform bodies.
 */

const params = new URLSearchParams(location.search);
const MAP_ID = params.get('map');
/*
 * A hand-test, rather than an ordinary playtest.
 *
 * `module` names the module being tested and `rung` the ladder rung it is being
 * tested AT. The sliders are then not a preference -- they are the claim the
 * verdict will be recorded against -- so they are pinned to the rung, they do not
 * touch the remembered playtest settings, and moving one voids the test until it
 * is put back.
 */
// what "back" means. Normally the map being played, but a hand-test is played in a
// throwaway arena the editor built -- returning there would drop you into the test
// box instead of the map you were building.
const BACK_TO = params.get('from') || params.get('map');
const HAND_MODULE = params.get('module');
const HAND_RUNG = params.has('rung') ? Number(params.get('rung')) : null;
const handRung = (HAND_MODULE && typeof Ladder !== 'undefined' && HAND_RUNG !== null &&
                  Ladder.RUNGS[HAND_RUNG]) || null;


let mapData = null;
let tileNames = [];
const setStatus = (s) => { document.getElementById('status').textContent = s; };

/*
 * Quick-run is used in a loop -- edit, play, back, edit -- and every trip
 * through it reloads this page, so anything set here used to be thrown away the
 * moment it was used. The settings are shared with the userscript's playtest
 * panel, since "how strong is Johnny" is a question about the player rather
 * than about where the level is being played.
 */
function savePrefs() {
  MapEditorPlay.saveValues(upValues, {
    quickRestart: document.getElementById('quickRestart').checked,
  });
}

// ------------------------------------------------------------------ boot
async function boot() {
  if (!MAP_ID) { setStatus('no map specified'); return; }
  mapData = await (await fetch('/api/map/' + MAP_ID)).json();
  tileNames = [...new Set((mapData.art || []).map((a) => a.tile).filter(Boolean))];
  setStatus((mapData.meta && mapData.meta.name) || MAP_ID);

  buildUpgradePanel();
  await loadSdk();
  patchAndStart();
}

function loadSdk() {
  // the SDK's own load order, minus the coolmath ad script and jquery
  const files = ['js/phaser.js', 'js/loader.js', 'js/title.js', 'js/level.js',
                 'js/shop.js', 'js/boss.js', 'js/gameOver.js', 'js/main.js'];
  return files.reduce((chain, f) => chain.then(() => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = f; s.onload = res; s.onerror = () => rej(new Error('failed to load ' + f));
    document.head.appendChild(s);
  })), Promise.resolve());
}

function patchAndStart() {
  /*
   * Everything the game needs unpinning is in mapkit, which is what actually
   * ships. Quick-run deliberately uses the same modules rather than its own
   * copies, so a bug found here is a bug in the shipped runtime.
   */
  const host = MapkitPatcher.install(window, {
    onAdBreak: () => {
      const quick = document.getElementById('quickRestart');
      if (!quick || quick.checked) { try { levl = 1; } catch (e) {} }
    },
  });

  /*
   * Where a real ad break exists it has to run, so the skip-the-shop shortcut is
   * withdrawn rather than silently doing nothing. Quick-run is served from
   * localhost today, so this is a guard rather than a live case.
   */
  if (host && host.realAdBreak) {
    const q = document.getElementById('quickRestart');
    if (q) { q.checked = false; q.disabled = true;
      q.parentElement.lastElementChild.textContent = 'quick restart (unavailable: ad break must run)'; }
  }

  // the map itself. Saved files are already in the game's own shape.
  maps[1] = mapData;

  // 3. preload the map's textures alongside the game's own assets
  const origPreload = LoaderState.preload;
  LoaderState.preload = function () {
    origPreload.call(this);
    MapkitRenderer.preload(window, mapData, (n) => '/tile/' + encodeURIComponent(n) + '.png');
  };

  // 4. skip the splash and the title screen
  const origLoaderCreate = LoaderState.create;
  LoaderState.create = function () {
    origLoaderCreate.call(this);
    if (game.btnPlay) game.btnPlay.destroy();
    applyUpgrades();
    levl = 1;
    newState();
  };

  const origMainCreate = MainState.create;
  MainState.create = function () { origMainCreate.call(this); game.splashCT = 1; };

  // Crushers and doors are installed by MapkitPatcher.install above. Installing
  // them again here would wrap iniLevel a second time and build every door
  // twice, leaving two sprites per door with only one of them being driven.

  const game_ = new Phaser.Game(screenWidth, screenHeight, Phaser.CANVAS, 'game');
  window.game = game_;
  game_.state.add('Main', MainState);
  game_.state.add('Loader', LoaderState);
  game_.state.add('Title', TitleState);
  game_.state.add('Level', LevelState);
  game_.state.add('Shop', ShopState);
  game_.state.add('GameOver', GameOverState);
  game_.state.start('Main');
}

// ------------------------------------------------------------------ upgrades
/*
 * The tracks, the tier encoding and the remembered settings all live in
 * editor-play.js, because the userscript playtests levels too and two copies of
 * "what does game.ldat.spd.v = 0.7 mean" is exactly the kind of thing that goes
 * quietly out of step. Only the sidebar around them belongs to this page.
 */
const upValues = handRung ? MapEditorPlay.valuesForRung(handRung) : MapEditorPlay.startingValues();
let sliders = null;
function buildUpgradePanel() {
  const quick = document.getElementById('quickRestart');
  const prefs = MapEditorPlay.readPrefs();
  if (prefs.quickRestart !== undefined) quick.checked = !!prefs.quickRestart;
  quick.onchange = savePrefs;

  sliders = MapEditorPlay.buildSliders(document, document.getElementById('ups'), upValues, (committed) => {
    applyUpgrades();
    // a hand-test must not overwrite the remembered playtest settings: the rung is
    // the module's number, not this browser's preference
    if (committed && !handRung) savePrefs();
    if (handRung) renderHand();
  });

  document.getElementById('maxAll').onclick = () => sliders.set((u) => u.max);
  document.getElementById('zeroAll').onclick = () => sliders.set(() => 0);
  document.getElementById('restart').onclick = () => {
    applyUpgrades();
    if (window.game && window.levl !== undefined) { levl = 1; newState(); }
  };
  // carry the map id back, so the editor reopens what was being edited rather
  // than starting on a blank Untitled
  document.getElementById('back').onclick = () => {
    location.href = BACK_TO ? '/?map=' + encodeURIComponent(BACK_TO) : '/';
  };
  if (handRung) renderHand();
}

/*
 * The hand-test bar.
 *
 * The verdict is recorded HERE, next to the act, rather than back in the editor:
 * "did I actually clear that" is a question with a short memory, and a loop that
 * ends in a different tab ends in nobody recording anything.
 *
 * Two buttons, which together walk the ladder: clear it and the rung is written
 * down; fail and the next rung up is loaded to try again. Because both play at
 * real ladder rungs, the rung recorded is always the rung that was actually
 * cleared -- no "lowest rung dominating some off-ladder combo" arithmetic to get
 * wrong.
 */
/*
 * Attempts, kept across reloads.
 *
 * A person failing a rung is NOT the rung being too low -- it is a person having
 * one go at a platformer. Moving up the ladder on the first death would grade
 * every module harder than it is, and a library of over-graded modules builds a
 * map padded with upgrades nobody needed. So failing an attempt and giving up on
 * a rung are two different buttons, and only the second one moves.
 *
 * The count is manual on purpose. A restart is not reliably a failed attempt --
 * you restart to re-run an approach, to look at something again, because the
 * camera was wrong -- and a number invented from ambiguous events would be worse
 * than the person's own claim about how many tries it took.
 *
 * The trail of given-up rungs travels with it, so a verdict recorded at rung 18
 * can say what happened at 12 and 14. That is the real content of a hand-play:
 * not just where it becomes possible, but how hard it was on the way.
 */
const HAND_PREFS = 'johnny-handtest';
function readHand() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(HAND_PREFS)); } catch (e) { /* fine */ }
  if (!d || d.module !== HAND_MODULE) d = { module: HAND_MODULE, rung: null, attempts: 0, trail: [] };
  if (d.rung !== (handRung && handRung.index)) { d.rung = handRung && handRung.index; d.attempts = 0; }
  if (!Array.isArray(d.trail)) d.trail = [];
  return d;
}
function writeHand(d) {
  try { localStorage.setItem(HAND_PREFS, JSON.stringify(d)); } catch (e) { /* fine */ }
}
let hand = null;

const trailText = (d) =>
  d.trail.map((t) => 'rung ' + t.rung + ' failed after ' + t.attempts +
    (t.attempts === 1 ? ' attempt' : ' attempts')).join('; ');

function defaultWhy(d) {
  const tried = d.attempts + 1;
  return 'Played the arena at rung ' + handRung.index + ' (' + Ladder.label(handRung) +
    ') and cleared it on attempt ' + tried + '.' +
    (d.trail.length ? ' Before that: ' + trailText(d) + '.' : '');
}

function renderHand() {
  const el = document.getElementById('hand');
  if (!handRung) return;
  if (!hand) hand = readHand();
  el.style.display = 'block';
  const pinned = MapEditorPlay.matchesRung(upValues, handRung);
  el.classList.toggle('void', !pinned);
  const next = Ladder.RUNGS[handRung.index + 1];
  const tried = hand.attempts + 1;
  el.innerHTML =
    '<h3>Hand-test: ' + esc(HAND_MODULE) + ' at rung ' + handRung.index + '</h3>' +
    '<div class="combo">' + esc(Ladder.label(handRung)) +
      ' &middot; time max &middot; gunpow 0</div>' +
    '<p class="msg">Attempt <b>' + tried + '</b> at this rung' +
      (hand.trail.length ? ' &middot; ' + esc(trailText(hand)) : '') + '</p>' +
    (pinned ? '' : '<p class="msg bad">The sliders no longer match rung ' + handRung.index +
      '. A verdict is a claim about a rung, so put them back (or reload) before recording one.</p>') +
    '<textarea id="handwhy" placeholder="what happened"></textarea>' +
    '<button id="handok" class="primary"' + (pinned ? '' : ' disabled') +
      '>cleared it on attempt ' + tried + '</button>' +
    '<button id="handfail">that attempt failed &mdash; try again</button>' +
    (next ? '<button id="handup">give up on rung ' + handRung.index +
      ' &mdash; move to rung ' + next.index + '</button>' : '') +
    '<p class="msg" id="handmsg">Failing is not the same as impossible: keep trying at this ' +
      'rung as long as you think it is on you rather than on the module. Only move up when you ' +
      'have decided the rung genuinely is not enough &mdash; a rung raised too easily grades ' +
      'the module harder than it is, and a verdict may never be lowered afterwards.</p>';

  const why = document.getElementById('handwhy');
  why.value = defaultWhy(hand);
  document.getElementById('handok').onclick = () => recordVerdict(why.value, tried);

  document.getElementById('handfail').onclick = () => {
    hand.attempts++;
    writeHand(hand);
    renderHand();
    // restarting is what actually starts the next attempt
    if (window.game && window.levl !== undefined) { applyUpgrades(); levl = 1; newState(); }
  };

  const up = document.getElementById('handup');
  if (up) up.onclick = () => {
    hand.trail.push({ rung: handRung.index, attempts: tried });
    hand.rung = next.index;
    hand.attempts = 0;
    writeHand(hand);
    const u = new URL(location.href);
    u.searchParams.set('rung', String(next.index));
    location.href = u.toString();
  };
}

const esc = (v) => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

async function recordVerdict(why, attempts) {
  const msg = document.getElementById('handmsg');
  const btn = document.getElementById('handok');
  btn.disabled = true;
  msg.className = 'msg';
  msg.textContent = 'recording…';
  let r = null;
  try {
    r = await (await fetch('/api/handplay/' + encodeURIComponent(HAND_MODULE), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        minRung: handRung.index,
        why,
        attempts,
        // what was tried and given up on before this rung, so the file says how hard
        // the module was and not merely where it became possible
        trail: hand.trail,
      }),
    })).json();
  } catch (e) { r = { ok: false, error: e.message }; }
  if (r && r.ok) {
    // the run is over, so the attempt counter starts clean for the next module
    hand = { module: HAND_MODULE, rung: handRung.index, attempts: 0, trail: [] };
    writeHand(hand);
    msg.className = 'msg good';
    msg.textContent = 'Recorded: ' + HAND_MODULE + ' is hand-played at rung ' + r.minRung +
      (r.solved !== null && r.minRung > r.solved
        ? ', raised from the solved ' + r.solved + '.'
        : ', confirming the solved rung.');
  } else {
    msg.className = 'msg bad';
    msg.textContent = (r && r.error) || 'could not record it';
    btn.disabled = false;
  }
}
const applyUpgrades = () => MapEditorPlay.apply(window, upValues);

boot().catch((e) => setStatus('error: ' + e.message));
</script>
</body>
</html>
