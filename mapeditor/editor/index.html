<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Map Editor</title>
<style>
  html,body { height:100%; margin:0; background:#14161c; overflow:hidden; }
  #host { height:100%; }
  #boot { color:#e07a7a; font:13px ui-sans-serif,system-ui,sans-serif; padding:14px; }
</style>
</head>
<body>
<div id="host"></div>
<div id="boot"></div>

<script src="/mapkit/mapformat.js"></script>
<!-- the real solver/ladder.js, so the rung reference cannot drift from the solver -->
<script src="/solver/ladder.js"></script>
<script src="/editor-core.js"></script>
<script>
'use strict';
/*
 * The editor, hosted by the dev server.
 *
 * All of the editor is in editor-core.js, because it also runs inside the game
 * page as a userscript. This file is only the half that differs: here maps are
 * files the server reads and writes, textures are PNGs out of tiles/extracted/,
 * and Play opens the quick-run page in another tab.
 */
const io = {
  storageKey: 'johnny-editor',

  async listMaps() {
    const st = await (await fetch('/api/state')).json();
    return st.maps;
  },
  async loadMap(id) {
    return (await fetch('/api/map/' + encodeURIComponent(id))).json();
  },
  async saveMap(id, payload) {
    const r = await fetch('/api/map/' + encodeURIComponent(id), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ map: payload.map, thumb: payload.thumb }),
    });
    return r.json();
  },
  async vanillaMap() {
    return (await fetch('/api/vanilla')).json();
  },

  /*
   * The module library is files in mapeditor/modules/, the same ones
   * solver/solve-module.js reads and writes. The server serves them through the
   * solver's own reader, so a solve record that no longer describes its module has
   * already been dropped by the time it reaches a badge here.
   */
  async listModules() {
    return (await fetch('/api/modules')).json();
  },
  async saveModule(name, mod) {
    const r = await fetch('/api/module/' + encodeURIComponent(name), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(mod),
    });
    return r.json();
  },
  /*
   * Run the solver over a module and write the answer into its file. Only the dev
   * server has this -- solving is node, and the userscript has no node -- so the
   * editor treats it as optional and a module saved in the page stays unsolved.
   */
  async solveModule(name) {
    const r = await fetch('/api/solve/' + encodeURIComponent(name), { method: 'POST' });
    return r.json();
  },
  async tiles() {
    const st = await (await fetch('/api/state')).json();
    return st.tiles;
  },
  tileImage(name) {
    const img = new Image();
    img.src = '/tile/' + encodeURIComponent(name) + '.png';
    return img;
  },
  /*
   * opts turns an ordinary playtest into a hand-test: the play page pins the
   * upgrade sliders to that ladder rung and offers to record the verdict, which is
   * the only way a module ever gets marked as played by a person.
   */
  play(id, opts) {
    let url = '/play?map=' + encodeURIComponent(id);
    if (opts && opts.module) {
      url += '&module=' + encodeURIComponent(opts.module) + '&rung=' + encodeURIComponent(opts.rung);
      // where to go back to, which for a hand-test is NOT the map being played
      if (opts.from) url += '&from=' + encodeURIComponent(opts.from);
    }
    window.open(url, 'johnny-quickrun');
  },
  async moduleArena(name) {
    const r = await fetch('/api/arena/' + encodeURIComponent(name), { method: 'POST' });
    return r.json();
  },
};

// ?map=<id> opens straight into that map, which is how the quick-run page hands
// you back to what you were editing
const want = new URLSearchParams(location.search).get('map');
try {
  MapEditor.mount({ root: document.getElementById('host'), io, map: want || undefined });
} catch (e) {
  document.getElementById('boot').textContent = 'editor failed to start: ' + e.message;
}
</script>
</body>
</html>
